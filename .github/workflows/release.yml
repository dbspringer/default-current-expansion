name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# The packager creates the GitHub release, and the repo's default token is
# read-only.
permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Pinned to a commit, because this step runs with a token that can write
      # to the repo. Dependabot opens a PR when the packager has a new release.
      # The CurseForge project ID comes from X-Curse-Project-ID in the TOC.
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # The packager skips an upload when its key is empty, so a secret that
          # isn't set yet does no harm.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
